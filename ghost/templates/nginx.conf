server {
    listen 0.0.0.0:443 ssl;
    server_name ghost.dzen.dev;
    ssl_certificate /etc/letsencrypt/live/ghost.dzen.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ghost.dzen.dev/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 50m;
    if ($host != ghost.dzen.dev) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:2368;
        proxy_set_header Host ghost.dzen.dev;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
    }
}
