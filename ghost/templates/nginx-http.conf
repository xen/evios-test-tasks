server {
    listen 0.0.0.0:80;
    server_name ghost.dzen.dev;
    server_tokens off;
    if ($host != ghost.dzen.dev) { return 404; }
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location / { return 301 https://ghost.dzen.dev$request_uri; }
}
